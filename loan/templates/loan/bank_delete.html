{% extends 'base.html' %}

{% block title %}Delete{% endblock %}

{% block content %}

<h2>Eliminar esta préstamo:</h2>

<p>¿Estás seguro de querer eliminar este préstamo?<br>
  <span>{{ bank_loan.name }}</span>
</p>

<form action="" method="POST" onsubmit="return confirmDelete();">
  {% csrf_token %}
  <input type="submit" value="Si, eliminar.">
  <input type="button" value="Cancel" onclick="window.location.href='{% url 'loan:bank_detail' bank_loan.id  %}';">
</form>

{% endblock %}

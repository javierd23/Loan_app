<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Nosotros{% endblock %}</title>
</head>
<body>
  <nav>
    <a href="{% url 'home:about_page' %}">Nosotros</a>
    <a href="{% url 'home:more_page' %}">Mas+</a>
    <a href="{% url 'home:contact_page' %}">Contactos</a>
    <a href="{% url 'forum:all' %}">Forum</a>
    {% if user.is_authenticated %}
    <a href="{% url 'logout' %}">Cerrar sesión</a>
    {% else %}
    <a href="{% url 'login' %}">Iniciar sesión</a>
    {% endif %}

    {% load static %}
    <h1><a href="{% url 'home:home' %}"><img src="{% static 'home/logo.png' %}" alt="Logo de tuCuotaRD" width="100" height="100"></a></h1>
  </nav>
<main id="content">
  {% block content %} {% endblock %}
  {% block sidebar %} {% endblock %}
  {% block navbar %} {% endblock %}
  {% block footer %} {% endblock %}
</main>
</body>
</html>

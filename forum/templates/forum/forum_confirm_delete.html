{% extends 'base.html' %}

{% block title %}Eliminar Forum{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-20 p-6 bg-white rounded-lg shadow-lg text-center">

  <h2 class="text-2xl font-semibold mb-6 text-gray-800">Eliminar este Forum</h2>

  <p class="mb-6 text-gray-700">
    ¿Estás seguro de querer eliminar el forum:<br>
    <span class="font-bold text-red-600">{{ forum }}</span>?
  </p>

  <form action="" method="POST" onsubmit="return confirmDelete();" class="flex justify-center gap-4">
    {% csrf_token %}
    <button type="submit"
            class="bg-red-600 hover:bg-red-700 text-white font-semibold px-6 py-2 rounded transition">
      Sí, eliminar
    </button>
    <button type="button"
            onclick="window.location.href='{% url 'forum:all' %}';"
            class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-semibold px-6 py-2 rounded transition">
      Cancelar
    </button>
  </form>

</div>

<script>
  function confirmDelete() {
    return confirm('¿Confirmas que quieres eliminar este forum? Esta acción no se puede deshacer.');
  }
</script>
{% endblock %}

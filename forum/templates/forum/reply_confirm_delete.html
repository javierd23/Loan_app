{% extends 'base.html' %}

{% block title %}Eliminar Respuesta{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto mt-12 p-6 bg-white dark:bg-gray-800 rounded-lg shadow-lg">

    <!-- Warning Banner -->
    <div class="flex items-center mb-6 p-4 bg-red-100 dark:bg-red-800 rounded">
        <svg class="w-6 h-6 text-red-600 dark:text-red-400 mr-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M12 5a7 7 0 11-7 7 7 7 0 017-7z"/>
        </svg>
        <p class="text-red-700 dark:text-red-200 font-semibold">¡Atención! Esta acción no se puede deshacer.</p>
    </div>

    <h2 class="text-2xl font-bold text-gray-800 dark:text-gray-100 mb-4">Eliminar esta respuesta</h2>

    <p class="mb-6 text-gray-700 dark:text-gray-300">
        ¿Estás seguro de que quieres eliminar esta respuesta?
        <span class="font-semibold text-red-600">{{ reply.text }}</span>
    </p>

    <form action="" method="POST" onsubmit="return confirmDelete();" class="flex gap-4">
        {% csrf_token %}
        <button type="submit"
                class="flex-1 flex items-center justify-center bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded transition">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
            </svg>
            Sí, eliminar
        </button>
        <button type="button"
                onclick="window.location.href='{% url 'forum:forum_detail' forum.id %}';"
                class="flex-1 flex items-center justify-center bg-gray-300 hover:bg-gray-400 text-gray-800 px-4 py-2 rounded transition">
            Cancelar
        </button>
    </form>
</div>

<script>
function confirmDelete() {
    return confirm('¿Confirmas que quieres eliminar esta respuesta? Esta acción no se puede deshacer.');
}
</script>
{% endblock %}

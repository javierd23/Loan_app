{% extends "base.html" %}
{% load tailwind_filters %}
{% block title %}Actualizar Respuesta{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto mt-12 p-8 bg-white dark:bg-gray-800 rounded-2xl shadow-lg border border-gray-200 dark:border-gray-700">
  <h2 class="text-2xl font-bold text-gray-900 dark:text-white mb-6 text-center">Actualizar Respuesta</h2>

  <form action="" method="post" class="space-y-6">
    {% csrf_token %}
    {{ form|crispy }}

    <div class="flex flex-col sm:flex-row justify-between gap-4">
      <button type="submit"
              class="w-full sm:w-auto bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-700 hover:to-blue-600 text-white py-2 px-6 rounded-lg shadow-md transition-all duration-300">
        Enviar
      </button>
      <button type="button"
              onclick="window.location.href='{% url 'forum:comment_reply_detail' comment.id %}';"
              class="w-full sm:w-auto bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-800 dark:text-gray-200 py-2 px-6 rounded-lg shadow-md transition-all duration-300">
        Cancelar
      </button>
    </div>
  </form>
</div>
{% endblock %}

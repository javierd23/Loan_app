{% extends "base.html" %}
{% load tailwind_filters %}
{% block title %}Actualizar Comentario{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-16 p-6 bg-white rounded-lg shadow-md">
  <form action="" method="post" class="space-y-6">
    {% csrf_token %}
    {{ form|crispy }}
    <div class="flex justify-between">
      <button type="submit"
              class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded transition">
        Someter
      </button>
      <button type="button"
              onclick="window.location.href='{% url 'forum:forum_detail' forum.id %}';"
              class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-semibold py-2 px-4 rounded transition">
        Cancelar
      </button>
    </div>
  </form>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block title %}Contraseña cambiada con éxito{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-20 p-8 bg-white rounded-lg shadow-lg text-center">
  <svg class="mx-auto mb-4 w-16 h-16 text-green-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" >
    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
  </svg>
  <h3 class="text-2xl font-semibold mb-4 text-green-700">¡Tu contraseña ha sido cambiada con éxito!</h3>
  <p class="mb-6 text-gray-600">Ya puedes iniciar sesión con tu nueva contraseña.</p>
  <a href="{% url 'login' %}" class="inline-block bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-6 rounded transition">
    Iniciar sesión
  </a>
</div>
{% endblock %}

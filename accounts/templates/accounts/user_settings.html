{% extends "base.html" %}
{% load tailwind_filters %}
{% block title %}Configuración{% endblock %}

{% block content %}

<nav class="mb-6" aria-label="breadcrumb">
  <ul class="breadcrumb text-sm">
    <li>
      <a href="{% url 'accounts:profile' request.user.username %}" class="text-blue-600 hover:text-blue-800 flex items-center gap-1">
        <!-- in case I want to add a narrow -->
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12h18m-6-6l6 6-6 6" />
        </svg>
        Volver a perfil
      </a>
    </li>
  </ul>
</nav>

<div class="w-full min-h-screen px-2 py-8">
  <div class="grid grid-cols-1 md:grid-cols-4 gap-8">

    <!-- Left Sidebar (empty for now) -->
    <aside class="hidden dark:bg-gray-900 md:block col-span-1"></aside>

    <!-- Main Content: Settings Form -->
    <main class="col-span-1 md:col-span-2 dark:bg-gray-900 bg-white shadow rounded-lg p-6">
      <h2 class="text-2xl font-semibold mb-6">Configuración de perfil</h2>
      <form action="{% url 'accounts:settings' %}" method="post" enctype="multipart/form-data" class="space-y-6">
        {% csrf_token %}
        {{ form|crispy }}
        <div>
          <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 transition">
            Guardar
          </button>
        </div>
        <input type="hidden" name="next" value="{{ next }}">
      </form>
    </main>

    <!-- Right Sidebar: Change Password -->
    <aside class="col-span-1 bg-white dark:bg-gray-900 shadow rounded-lg p-6">
      <h3 class="text-gray-600 text-sm font-semibold mb-4 uppercase tracking-wide">Cambiar contraseña</h3>
      <a href="{% url 'accounts:password_change' %}" class="text-blue-600 hover:underline">
        Ir a cambiar contraseña
      </a>
    </aside>

  </div>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block content %}
<h3 class="text-xl font-semibold mb-4">Cambiar contraseña</h3>
<form method="post" class="space-y-4 bg-white p-6 rounded shadow max-w-md">
  {% csrf_token %}
  {{ form.as_p }}
  <div class="flex gap-4">
    <input type="submit" value="Cambiar" class="bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded cursor-pointer" />
    <input type="button" onclick="window.location.href='{% url 'login' %}'" value="Regresar al inicio" class="bg-gray-300 hover:bg-gray-400 py-2 px-4 rounded cursor-pointer" />
  </div>
</form>
{% endblock %}

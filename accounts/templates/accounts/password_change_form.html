{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-100 dark:bg-gray-800">
  <form method="post" class="space-y-4 bg-white dark:bg-gray-900 p-6 rounded shadow max-w-md w-full">
    <h3 class="text-xl font-semibold mb-4 text-center">Cambiar contraseña</h3>
    {% csrf_token %}
    {{ form.as_p }}
    <div class="flex gap-4 justify-center">
      <input type="submit" value="Cambiar" class="bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded cursor-pointer" />
      <input type="button" onclick="window.location.href='{% url 'login' %}'" value="Regresar al inicio" class="bg-gray-300 hover:bg-gray-400 py-2 px-4 rounded cursor-pointer" />
    </div>
  </form>
</div>
{% endblock %}

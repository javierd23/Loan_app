{% extends "base.html" %}

{% block title %}Restablecer contraseña{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-16 p-8 bg-white rounded-lg shadow-md">
  <h3 class="text-2xl font-semibold text-gray-800 mb-4 text-center">Restablecer contraseña</h3>
  <p class="text-gray-600 mb-6 text-center">
    Escribe tu correo electrónico y te enviaremos instrucciones para restablecerla.
  </p>

  <form method="post" class="space-y-6">
    {% csrf_token %}
    {{ form.as_p|safe }}

    <input
      type="submit"
      value="Restablecer contraseña"
      class="w-full py-3 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition cursor-pointer"
    >
  </form>
</div>
{% endblock %}

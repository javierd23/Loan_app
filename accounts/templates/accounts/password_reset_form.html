{% extends "base.html" %}

{% block title %}Restablecer contraseña{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-r from-blue-100 via-purple-100 to-pink-100">
  <div class="w-full max-w-md p-8 bg-white rounded-2xl shadow-2xl border border-gray-200">

    <h3 class="text-3xl font-bold text-gray-800 mb-2 text-center">🔒 Restablecer contraseña</h3>
    <p class="text-gray-500 mb-6 text-center">
      Ingresa tu correo electrónico y te enviaremos instrucciones para restablecerla.
    </p>

    <form method="post" class="space-y-5">
      {% csrf_token %}
      {{ form.as_p|safe }}

      <input
        type="submit"
        value="Restablecer contraseña"
        class="w-full py-3 bg-gradient-to-r from-purple-500 to-blue-500 text-white font-semibold rounded-xl shadow-lg hover:from-purple-600 hover:to-blue-600 transition-all duration-300 cursor-pointer"
      >
    </form>

    <p class="mt-6 text-center text-gray-400 text-sm">
      <a href="{% url 'login' %}" class="text-blue-500 hover:underline">Volver al inicio de sesión</a>
    </p>

  </div>
</div>
{% endblock %}
